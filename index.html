<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b8f82">
<title>우기's 주식 트레이더</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우기's 주식">
<meta name="mobile-web-app-capable" content="yes">
<script>
// 저장된 화면 설정(색 테마·라이트/다크)을 첫 화면 그리기 전에 적용해 깜빡임을 막는다
try { var L = JSON.parse(localStorage.getItem('trader-look-v1') || '{}'), R = document.documentElement; if (L.a) R.setAttribute('data-accent', L.a); if (L.m && L.m !== 'auto') R.setAttribute('data-mode', L.m); } catch (e) { }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="row1">
    <img class="logo" src="icon-192.png" alt="">
    <h1>우기's 주식 트레이더</h1>
    <span id="fresh" class="chip">불러오는 중</span>
    <button id="refresh" class="icon" type="button" aria-label="새로고침">↻</button>
  </div>
  <div class="seg" id="lens" aria-label="관점">
    <button data-l="pool" class="on" type="button">웅덩이</button>
    <button data-l="doki" type="button">도키</button>
    <button data-l="both" type="button">통합</button>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabs" id="tabs">
  <button data-t="today" class="on" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>오늘</span></button>
  <button data-t="stock" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m8 15 3-4 3 2 4-6"/></svg><span>종목</span></button>
  <button data-t="market" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/></svg><span>시장</span></button>
  <button data-t="tracker" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6"/><path d="M10 17h6"/></svg><span>거물</span></button>
  <button data-t="verify" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><span>검증</span></button>
  <button data-t="acct" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7V6a2 2 0 0 1 2-2h12"/><circle cx="16.5" cy="13.5" r="1"/></svg><span>계좌</span></button>
</nav>

<script src="engine.js"></script>
<script src="regime.js"></script>
<script src="app.js"></script>
</body>
</html>
