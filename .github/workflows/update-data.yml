name: update-data

# 시세는 장 시간에 주기적으로 갱신해 GitHub Pages 로 배포한다. cron 은 UTC 기준이며 실제 실행은 수 분~수십 분 늦을 수 있다.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fund:
        description: "국내 적정가(DART)도 갱신"
        type: boolean
        default: false
      add_codes:
        description: "종목 추가: 코드 6자리, 쉼표로 구분. 이름은 코드:이름 (예 035420, 360750:TIGER 미국S&P500)"
        type: string
        default: ""
      remove_codes:
        description: "종목 삭제: 코드 6자리, 쉼표로 구분 (지수·섹터 ETF는 삭제 불가)"
        type: string
        default: ""
  schedule:
    - cron: "*/10 0-6 * * 1-5"    # 국내 장중 (KST 09:00~15:59)
    - cron: "30 22 * * 1-5"       # 평일 한국 장 마감 후 1회(미국 마감 반영은 다음 날 아침 실행에서)
    - cron: "0 23 * * 0"          # 일요일: 적정가 갱신

permissions:
  contents: write   # 종목 추가·삭제 시 data/universe.json 변경을 저장하기 위함(수동 실행 입력이 있을 때만 사용)
  pages: write
  id-token: write

# 배포가 겹치지 않게 한다. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 입력값은 환경변수로만 넘긴다(명령어에 직접 끼워 넣지 않음). 수동 실행 입력이 있을 때만 동작한다.
      - name: 종목 추가·삭제 (수동 실행 입력이 있을 때만)
        id: edit
        if: ${{ inputs.add_codes != '' || inputs.remove_codes != '' }}
        env:
          ADD_CODES: ${{ inputs.add_codes }}
          REMOVE_CODES: ${{ inputs.remove_codes }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python tools/edit_universe.py

      - name: 종목 목록 변경 저장
        if: ${{ steps.edit.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe.json
          git commit -m "종목 목록 변경 (앱에서 요청)"
          git push

      - name: 이전 배포본 이어받기
        run: python tools/seed_from_site.py

      - name: 시세 갱신
        run: python tools/update_data.py

      - name: 국내 공시·내부자·대량보유 수집 (DART, 막히면 기존 값 유지)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python tools/tracker_kr.py

      - name: 국내 적정가 갱신 (일요일 또는 수동 실행 때만)
        if: ${{ github.event.schedule == '0 23 * * 0' || inputs.fund == true || steps.edit.outputs.changed == 'true' }}
        continue-on-error: true   # 키가 없거나 호출 제한이면 기존 값을 유지하고 배포는 계속한다
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python tools/fund_kr.py

      - name: 배포 폴더 만들기
        run: python tools/build_site.py

      - name: 개인정보·비밀 점검 (실패 시 배포 중단)
        run: python tools/privacy_check.py . _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
